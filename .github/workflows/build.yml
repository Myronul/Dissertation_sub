name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CONTIKI_REPO: contiki-os/contiki
  CONTIKI_REF: 32b5b17f674232867c22916bb2e2534c8e9a92ff
  TARGET: sky

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Contiki
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTIKI_REPO }}
          ref: ${{ env.CONTIKI_REF }}
          path: contiki

      - name: Checkout research_protocol
        uses: actions/checkout@v4
        with:
          path: contiki/examples/research_protocol

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-msp430 binutils-msp430 msp430-libc

      - name: Build
        working-directory: contiki/examples/research_protocol
        run: make TARGET=${{ env.TARGET }}

      - name: Collect ELF
        working-directory: contiki/examples/research_protocol
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp research_protocol.${{ env.TARGET }} "$GITHUB_WORKSPACE/out/research_protocol-${{ env.TARGET }}.elf"
          cp *.map "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          file "$GITHUB_WORKSPACE"/out/*.elf
          msp430-size "$GITHUB_WORKSPACE"/out/*.elf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: research_protocol-${{ env.TARGET }}
          path: out/
          if-no-files-found: error